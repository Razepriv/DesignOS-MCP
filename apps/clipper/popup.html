<!DOCTYPE html>
<html><head><title>DesignOS Clipper</title>
<style>
  body { width: 320px; padding: 16px; font-family: system-ui; background: #0a0a0a; color: #f5f5f5; }
  h1 { font-size: 18px; margin-bottom: 12px; }
  button { width: 100%; padding: 10px; margin: 4px 0; border: 1px solid #333; border-radius: 6px; background: #1a1a1a; color: #f5f5f5; cursor: pointer; font-size: 14px; }
  button:hover { background: #262626; }
  .status { font-size: 12px; color: #888; margin-top: 8px; }
</style>
</head><body>
  <h1>🎨 DesignOS Clipper</h1>
  <button id="capturePage">Capture Page</button>
  <button id="captureScreenshot">Capture Screenshot</button>
  <button id="selectElement">Select Element</button>
  <button id="extractDesignSystem">Extract Design System</button>
  <button id="pickImages">Pick Images</button>
  <div class="status" id="status">Ready</div>
  <script src="popup.js"></script>
</body></html>
