name: Bug Report
description: File a bug report for DesignOS-MCP
labels: ["bug"]
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, and MCP Client used.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: DesignOS-MCP version or commit SHA.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Provide relevant error logs or output snippets.
    validations:
      required: false
