name: Feature Request
description: Propose a new capability for DesignOS-MCP
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: capability
    attributes:
      label: Proposed capability
      description: How should the new feature work?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it belongs in DesignOS
      description: How does this align with DesignOS core principles (e.g. design intelligence, not UI copying)?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Example workflow
      description: Provide an example of how an AI Agent or User would interact with this.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What alternatives have you considered?
    validations:
      required: false
